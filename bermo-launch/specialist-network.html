<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BERMO — Specialist Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan:  #00f5d4;
      --black: #0a0a0a;
      --ink:   #0e0e10;
      --white: #ffffff;
      --cream: #f0efe9;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      font-family: 'Inter', sans-serif;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    /* ─── Section ─── */
    .section {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 16px;
    }

    .headline {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(26px, 4.5vw, 44px);
      font-weight: 800;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 12px;
    }

    .headline .cyan { color: var(--cyan); }

    .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
      margin-bottom: 44px;
    }

    /* ─── Flip bar ─── */
    .flip-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 7px 18px 7px 12px;
      margin-bottom: 40px;
    }

    .flip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
      flex-shrink: 0;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    .flip-bar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    .flip-container {
      display: inline-block;
      height: 1.25em;
      overflow: hidden;
      perspective: 400px;
      min-width: 140px;
      text-align: left;
    }

    .flip-word {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      transform-origin: top center;
    }

    .flip-word.in  { animation: fIn  0.42s var(--ease-spring) forwards; }
    .flip-word.out { animation: fOut 0.32s ease-in forwards; }

    @keyframes fIn  {
      from { transform: rotateX(-80deg); opacity: 0; }
      to   { transform: rotateX(0);      opacity: 1; }
    }
    @keyframes fOut {
      from { transform: rotateX(0);     opacity: 1; }
      to   { transform: rotateX(80deg); opacity: 0; }
    }

    /* ─── Puzzle SVG ─── */
    .puzzle-wrap {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 44px;
    }

    .puzzle-wrap svg { width: 100%; height: auto; overflow: visible; }

    /* Piece groups */
    .piece-g {
      transform-box: fill-box;
      transform-origin: center;
    }

    .piece-g.will-snap {
      opacity: 0;
    }

    @keyframes snapIn {
      0%   { transform: translate(var(--fx,0px), var(--fy,0px)) scale(0.72); opacity: 0; }
      62%  { transform: translate(0,0) scale(1.06); opacity: 1; }
      78%  { transform: translate(0,0) scale(0.97); }
      90%  { transform: translate(0,0) scale(1.01); }
      100% { transform: translate(0,0) scale(1);    opacity: 1; }
    }

    .piece-g.snapping {
      animation: snapIn 0.72s var(--ease-spring) forwards;
    }

    /* Hover lift on non-core pieces */
    .piece-g:not(.core-g):hover .piece-bg {
      filter: brightness(1.08);
      cursor: pointer;
    }

    /* ─── Stats row ─── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.5s 0.3s, transform 0.5s 0.3s var(--ease-spring);
    }

    .stats.show { opacity: 1; transform: translateY(0); }

    .stat-num {
      font-family: 'Inter Tight', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      display: block;
      line-height: 1;
    }

    .stat-num span { color: var(--cyan); }
    .stat-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 4px; display: block; }

    /* ─── CTA ─── */
    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--cyan);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s, gap 0.2s;
    }

    .cta-link:hover { opacity: 1; gap: 10px; }
  </style>
</head>
<body>

<section class="section" id="section">

  <p class="section-label">The BERMO Network</p>

  <h2 class="headline">
    One scan. Every specialist.<br>
    <span class="cyan">Snapped in.</span>
  </h2>

  <p class="sub">Pre-vetted across every discipline. Deployed from one command center.</p>

  <!-- Flip bar -->
  <div class="flip-bar">
    <span class="flip-dot"></span>
    <span class="flip-bar-label">Now deploying</span>
    <div class="flip-container" id="flipContainer">
      <span class="flip-word">Website Design</span>
    </div>
  </div>

  <!-- Puzzle -->
  <div class="puzzle-wrap">
    <svg id="puzzleSvg" viewBox="0 0 390 390" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div>
      <span class="stat-num">6<span>+</span></span>
      <span class="stat-label">Specialist pods</span>
    </div>
    <div>
      <span class="stat-num">16<span>+</span></span>
      <span class="stat-label">Industries</span>
    </div>
    <div>
      <span class="stat-num">1<span> wk</span></span>
      <span class="stat-label">Avg. deploy</span>
    </div>
  </div>

  <a href="#" class="cta-link">
    See how pods deploy
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M2.5 7h9M8 3.5L11.5 7 8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

</section>

<script>
/* ────────────────────────────────────────────────
   Puzzle piece path generator
   tabs: { top, right, bottom, left }
     1 = tab OUT (bump)
    -1 = slot IN (indent)
     0 = flat edge
   tr = tab circle radius
──────────────────────────────────────────────── */
function piecePath(px, py, pw, ph, tabs, tr = 17) {
  const r = 9;
  const { top = 0, right = 0, bottom = 0, left = 0 } = tabs;
  const cx = px + pw / 2, cy = py + ph / 2;
  const d = [];

  d.push(`M ${px + r} ${py}`);

  // TOP edge — left to right
  if (top !== 0) {
    d.push(`H ${cx - tr}`);
    // tab up: sweep 0 (CCW); slot down: sweep 1 (CW)
    d.push(`A ${tr} ${tr} 0 0 ${top === 1 ? 0 : 1} ${cx + tr} ${py}`);
  }
  d.push(`H ${px + pw - r}`);
  d.push(`Q ${px + pw} ${py} ${px + pw} ${py + r}`);

  // RIGHT edge — top to bottom
  if (right !== 0) {
    d.push(`V ${cy - tr}`);
    // tab right: sweep 1 (CW); slot left: sweep 0 (CCW)
    d.push(`A ${tr} ${tr} 0 0 ${right === 1 ? 1 : 0} ${px + pw} ${cy + tr}`);
  }
  d.push(`V ${py + ph - r}`);
  d.push(`Q ${px + pw} ${py + ph} ${px + pw - r} ${py + ph}`);

  // BOTTOM edge — right to left
  if (bottom !== 0) {
    d.push(`H ${cx + tr}`);
    // tab down: sweep 1 (CW); slot up: sweep 0 (CCW)
    d.push(`A ${tr} ${tr} 0 0 ${bottom === 1 ? 1 : 0} ${cx - tr} ${py + ph}`);
  }
  d.push(`H ${px + r}`);
  d.push(`Q ${px} ${py + ph} ${px} ${py + ph - r}`);

  // LEFT edge — bottom to top
  if (left !== 0) {
    d.push(`V ${cy + tr}`);
    // tab left: sweep 0 (CCW); slot right: sweep 1 (CW)
    d.push(`A ${tr} ${tr} 0 0 ${left === 1 ? 0 : 1} ${px} ${cy - tr}`);
  }
  d.push(`V ${py + r}`);
  d.push(`Q ${px} ${py} ${px + r} ${py}`);

  d.push('Z');
  return d.join(' ');
}

/* ────────────────────────────────────────────────
   Piece definitions
   Layout (col, row):
     [empty]        [Website Design] [AI Agents]
     [Brand Strategy] [BERMO.]      [AI Visibility]
     [Brand Messaging][Content]     [empty]
──────────────────────────────────────────────── */
const P = 110; // piece size
const O = 30;  // origin offset

const PIECES = [
  // (1,0) Website Design
  {
    id: 'website', label: ['Website', 'Design'], icon: '🌐',
    x: O + P, y: O,
    tabs: { right: 1, bottom: 1 },
    fill: '#1c1c20', stroke: 'rgba(255,255,255,0.1)',
    textFill: '#fff',
    delay: 80, fx: 0, fy: -180
  },
  // (2,0) AI Agents
  {
    id: 'ai-agents', label: ['AI', 'Agents'], icon: '🤖',
    x: O + P * 2, y: O,
    tabs: { left: -1, bottom: 1 },
    fill: '#00f5d4', stroke: 'none',
    textFill: '#0a0a0a',
    delay: 220, fx: 180, fy: -180
  },
  // (0,1) Brand Strategy
  {
    id: 'brand-strategy', label: ['Brand', 'Strategy'], icon: '⚡',
    x: O, y: O + P,
    tabs: { right: 1, bottom: 1 },
    fill: '#1c1c20', stroke: 'rgba(255,255,255,0.1)',
    textFill: '#fff',
    delay: 340, fx: -180, fy: 0
  },
  // (1,1) BERMO — CORE
  {
    id: 'bermo', isCore: true,
    x: O + P, y: O + P,
    tabs: { top: -1, left: -1, right: 1, bottom: 1 },
    fill: '#0d0d11',
    delay: 0
  },
  // (2,1) AI Visibility
  {
    id: 'ai-vis', label: ['AI', 'Visibility'], icon: '👁️',
    x: O + P * 2, y: O + P,
    tabs: { top: -1, left: -1 },
    fill: '#00f5d4', stroke: 'none',
    textFill: '#0a0a0a',
    delay: 340, fx: 180, fy: 0
  },
  // (0,2) Brand Messaging
  {
    id: 'brand-msg', label: ['Brand', 'Messaging'], icon: '✍️',
    x: O, y: O + P * 2,
    tabs: { top: -1, right: 1 },
    fill: '#1c1c20', stroke: 'rgba(255,255,255,0.1)',
    textFill: '#fff',
    delay: 220, fx: -180, fy: 180
  },
  // (1,2) Content
  {
    id: 'content', label: ['Content', 'Creation'], icon: '📱',
    x: O + P, y: O + P * 2,
    tabs: { top: -1, left: -1 },
    fill: '#1c1c20', stroke: 'rgba(255,255,255,0.1)',
    textFill: '#fff',
    delay: 80, fx: 0, fy: 180
  },
];

/* ─── Build SVG ─── */
const svg = document.getElementById('puzzleSvg');

svg.innerHTML = `
  <defs>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#00f5d4" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="piece-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Subtle dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <!-- Background dot grid inside the puzzle area -->
  <rect x="${O}" y="${O}" width="${P * 3}" height="${P * 3}" fill="url(#dots)" opacity="0.6"/>
`;

PIECES.forEach(p => {
  const path = piecePath(p.x, p.y, P, P, p.tabs);
  const midX = p.x + P / 2;
  const midY = p.y + P / 2;

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.classList.add('piece-g');
  if (p.isCore) g.classList.add('core-g');
  else          g.classList.add('will-snap');

  g.dataset.delay = p.delay || 0;
  if (!p.isCore) {
    g.style.setProperty('--fx', (p.fx || 0) + 'px');
    g.style.setProperty('--fy', (p.fy || 0) + 'px');
  }

  if (p.isCore) {
    // Core: dark fill + cyan ring path + wordmark
    const corePath = piecePath(p.x, p.y, P, P, p.tabs);
    g.innerHTML = `
      <!-- Core glow ring (slightly larger) -->
      <path d="${piecePath(p.x - 1, p.y - 1, P + 2, P + 2, p.tabs)}"
            fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.35"/>
      <!-- Core body -->
      <path class="piece-bg" d="${corePath}" fill="${p.fill}" filter="url(#core-glow)"/>
      <!-- Wordmark -->
      <text x="${midX}" y="${midY - 7}"
            text-anchor="middle"
            font-family="Montserrat, sans-serif"
            font-weight="900" font-size="17" fill="#ffffff">BERMO<tspan fill="#00f5d4">.</tspan></text>
      <text x="${midX}" y="${midY + 9}"
            text-anchor="middle"
            font-family="Inter, sans-serif"
            font-weight="600" font-size="7.5"
            fill="rgba(255,255,255,0.3)"
            letter-spacing="1.2">COMMAND CENTER</text>
    `;
  } else {
    const lines = p.label || [];
    const iconY   = midY - (lines.length > 1 ? 18 : 10);
    const line1Y  = midY + (lines.length > 1 ? 4 : 6);
    const line2Y  = line1Y + 13;

    const strokeAttr = p.stroke !== 'none'
      ? `stroke="${p.stroke}" stroke-width="1"`
      : '';

    g.innerHTML = `
      <path class="piece-bg" d="${path}" fill="${p.fill}" ${strokeAttr} filter="url(#piece-shadow)"/>
      <text x="${midX}" y="${iconY}" text-anchor="middle" font-size="20" dominant-baseline="middle">${p.icon || ''}</text>
      <text x="${midX}" y="${line1Y}"
            text-anchor="middle"
            font-family="'Inter Tight', sans-serif"
            font-weight="800" font-size="10"
            fill="${p.textFill}" letter-spacing="0.3">${lines[0] || ''}</text>
      ${lines[1] ? `<text x="${midX}" y="${line2Y}"
            text-anchor="middle"
            font-family="'Inter Tight', sans-serif"
            font-weight="800" font-size="10"
            fill="${p.textFill}" letter-spacing="0.3">${lines[1]}</text>` : ''}
    `;
  }

  svg.appendChild(g);
});

/* ─── Snap animation trigger ─── */
let fired = false;

function snapAll() {
  if (fired) return;
  fired = true;

  document.querySelectorAll('.piece-g.will-snap').forEach(g => {
    const delay = parseInt(g.dataset.delay || 0);
    setTimeout(() => g.classList.add('snapping'), delay);
  });

  setTimeout(() => {
    document.getElementById('stats').classList.add('show');
  }, 900);
}

const obs = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) { snapAll(); obs.disconnect(); }
}, { threshold: 0.35 });

obs.observe(svg);

// Auto-fire if already visible on load
if (svg.getBoundingClientRect().top < window.innerHeight * 0.95) snapAll();

/* ─── Flip bar ─── */
const WORDS = [
  'Website Design', 'AI Agents', 'Brand Strategy',
  'AI Visibility', 'Brand Messaging', 'Content Creation',
  'SEO & Search', 'Paid Media', 'Revenue Ops', 'Product Launches',
];

let wordIdx = 0;
const flipContainer = document.getElementById('flipContainer');

function nextWord() {
  const old = flipContainer.querySelector('.flip-word');
  if (old) {
    old.classList.add('out');
    old.addEventListener('animationend', () => old.remove(), { once: true });
  }
  wordIdx = (wordIdx + 1) % WORDS.length;
  const next = document.createElement('span');
  next.className = 'flip-word in';
  next.textContent = WORDS[wordIdx];
  flipContainer.appendChild(next);
}

setInterval(nextWord, 2200);
</script>
</body>
</html>
