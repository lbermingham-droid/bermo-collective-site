<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Found · BERMO.COLLECTIVE</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@400;500;600&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f5d4;--black:#0a0a0a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
.code{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:clamp(80px,15vw,180px);line-height:0.85;letter-spacing:-0.04em;color:var(--cyan);margin-bottom:16px;}
.msg{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:clamp(24px,4vw,48px);letter-spacing:-0.03em;text-transform:uppercase;line-height:0.95;margin-bottom:20px;}
.sub{font-family:'Inter',sans-serif;font-size:15px;color:rgba(255,255,255,0.5);line-height:1.7;max-width:400px;margin-bottom:36px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--cyan);color:var(--black);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;padding:14px 28px;text-decoration:none;border-radius:100px;transition:background .2s;}
.btn:hover{background:#c8f500;}
</style>
</head>
<body>
<div class="code">404</div>
<div class="msg">THIS PAGE DOESN'T EXIST.</div>
<p class="sub">Whatever you were looking for, it's not here. But we can still help you find what you need.</p>
<a href="index.html" class="btn">Back to Home</a>
</body>
</html>
